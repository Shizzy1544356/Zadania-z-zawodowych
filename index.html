
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Twoje wymarzone paznokcie</title>
    <link rel="stylesheet" href="styl.css">
</head>

   

<body>

    <aside>
        <img src="manicure.jpg" alt="Stylizacja paznokci">
    </aside>

    <main>
        <header>
            <h1>Twoje wymarzone paznokcie</h1>
        </header>

        <nav>
            <button id="button1">Kolor</button>
            <button id="button2">Kształt</button>
            <button id="button3">Wzór</button>
        </nav>

       <section id="section1">
    <h2>Kolor</h2>
    <img src="kolory.png" alt="Kolory lakierów do paznokci">
</section>

        <section id="section2">
    <h2>Kształt</h2>
    <img src="ksztalt.png" alt="Kształty paznokci">
</section>

        <section id="section3">
    <h2>Wzór</h2>

    <img src="1.jpg" alt="Wzór paznokci 1" width="100">
    <img src="2.jpg" alt="Wzór paznokci 2" width="100">
    <img src="3.jpg" alt="Wzór paznokci 3" width="100">
    <img src="4.jpg" alt="Wzór paznokci 4" width="100">
    <img src="5.jpg" alt="Wzór paznokci 5" width="100">
    <img src="6.jpg" alt="Wzór paznokci 6" width="100">
</section>

        <footer>
            <p>Autor strony: <em>Fabian Wesolowski</em></p>
        </footer>
    </main>
<script>
    const sekcja1 = document.getElementById("section1");
    const sekcja2 = document.getElementById("section2");
    const sekcja3 = document.getElementById("section3");

    const przycisk1 = document.getElementById("button1");
    const przycisk2 = document.getElementById("button2");
    const przycisk3 = document.getElementById("button3");

    function pokazSekcje(numer) {
        sekcja1.style.display = numer === 1 ? "block" : "none";
        sekcja2.style.display = numer === 2 ? "block" : "none";
        sekcja3.style.display = numer === 3 ? "block" : "none";

        przycisk1.style.backgroundColor = numer === 1 ? "Salmon" : "Crimson";
        przycisk2.style.backgroundColor = numer === 2 ? "Salmon" : "Crimson";
        przycisk3.style.backgroundColor = numer === 3 ? "Salmon" : "Crimson";
    }

    przycisk1.onmouseover = function() {
        pokazSekcje(1);
    };

    przycisk2.onmouseover = function() {
        pokazSekcje(2);
    };

    przycisk3.onmouseover = function() {
        pokazSekcje(3);
    };
</script>
</body>
</html>
